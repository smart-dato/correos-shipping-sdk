name: "Update Changelog"

on:
  release:
    types: [released]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Update Changelog
        uses: stefanzweifel/changelog-updater-action@a938690fad7edf25368f37e43a1ed1b34303eb36 # v1
        with:
          latest-version: ${{ github.event.release.name }}
          release-notes: ${{ github.event.release.body }}

      # Committed through the Contents API rather than `git push`, because
      # GitHub signs commits it creates itself. A pushed commit would be
      # unsigned and the signed-commits ruleset would reject it.
      - name: Commit updated CHANGELOG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md is unchanged, nothing to commit."
            exit 0
          fi

          sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/CHANGELOG.md?ref=main" --jq .sha)

          jq -n \
            --arg message "Update CHANGELOG" \
            --arg branch main \
            --arg sha "$sha" \
            --arg content "$(base64 -w0 CHANGELOG.md)" \
            '{message: $message, branch: $branch, sha: $sha, content: $content}' \
          | gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/CHANGELOG.md" --input -
